[package]
name = "@deckyard/jellyfin"
version = "0.2.0"
description = "Jellyfin media server REST API: sign-in and API keys, libraries, items with paging and search, resume, next up, played and favourite marks, images, users, scans, tasks, sessions"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# The client talks HTTP(S) to a Jellyfin server, so the deck needs `net`. No
# `exec`, no `sql`.
capabilities = ["net"]
keywords = ["jellyfin", "media-server", "self-hosted", "rest", "movies", "tv", "music"]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-jellyfin/main/deck.toml"
homepage = "https://github.com/deckyard/deck-jellyfin"
manual = "https://deckyard.github.io/deck-jellyfin/"

[engines]
jennifer = ">=0.26.0"
