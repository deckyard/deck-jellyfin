# Grimoire book configuration for the @deckyard/jellyfin documentation.

[book]
title = "@deckyard/jellyfin"
description = "Jellyfin media server client"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-jellyfin/"
repoUrl = "https://github.com/deckyard/deck-jellyfin"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-jellyfin/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
